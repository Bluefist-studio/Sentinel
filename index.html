<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sentinel v1.4 Recreated</title>
  <link rel="icon" href="player_drone.png">
  <link rel="stylesheet" href="sentinel_v1.4_recreated.css">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #gameStage {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 1365px;
      height: 768px;
      transform: translate(-50%, -50%) scale(var(--game-stage-scale, 1));
      transform-origin: center;
    }

    #gameCanvas {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      width: 1024px;
      height: 768px;
      background: #000;
      display: block;
      margin: 0;
      border-radius: 0;
      box-shadow: none;
    }

    .scrollbar-themed {
      scrollbar-width: thin;
      scrollbar-color: rgba(0,255,221,0.75) rgba(0,0,0,0.18);
    }
    .scrollbar-themed::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    .scrollbar-themed::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.12);
      border-radius: 999px;
    }
    .scrollbar-themed::-webkit-scrollbar-thumb {
      background: rgba(0,255,221,0.8);
      border-radius: 999px;
      border: 2px solid rgba(0,0,0,0.18);
    }
    .scrollbar-themed::-webkit-scrollbar-thumb:hover {
      background: rgba(0,255,221,1);
    }
  </style>
</head>
<body>
  <div id="gameStage">
    <canvas id="gameCanvas" width="1024" height="768"></canvas>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-leaderboard.js"></script>
  <script src="protocols.js"></script>
  <script src="waveControl.js"></script>
  <script src="sentinel_v1.4_recreated.js"></script>
  <script src="timelineEditorIntegration.js"></script>
  <script src="Editor.js"></script>
  <script src="tutorial.js"></script>
</body>
</html>
