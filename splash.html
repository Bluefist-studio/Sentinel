<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#020607">
  <title>Sentinel</title>
  <style>
    :root {
      color-scheme: dark;
      background: #020607;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: #020607;
    }

    .splash {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    .hud-artwork {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      user-select: none;
    }

    .progress-track {
      position: absolute;
      left: 50%;
      bottom: 18.1%;
      width: 48.4%;
      height: 2px;
      overflow: hidden;
      background: rgba(180, 230, 245, 0.35);
      transform: translateX(-50%);
    }

    .progress-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 6%;
      background: #39eaff;
      box-shadow: 0 0 12px #00cfff;
      animation: cinematic-progress 2.2s linear infinite;
      will-change: left;
    }

    .screen-reader-status {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes cinematic-progress {
      0% {
        left: 0;
      }

      100% {
        left: 94%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .progress-fill {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="splash" role="status" aria-live="polite">
    <img class="hud-artwork" src="hudlid_loading_startup.png" alt="">
    <div class="progress-track" role="progressbar" aria-label="Initializing Sentinel">
      <div class="progress-fill"></div>
    </div>
    <span class="screen-reader-status">Initializing Sentinel. Please wait.</span>
  </main>
</body>
</html>
